[package]
name = "n1deck"
version = "0.1.0"
edition = "2021"
description = "Schlanker Ersatz für VSD Craft (Basicolor / VSD N1)"

[lib]
name = "n1deck"
path = "src/lib.rs"

[[bin]]
name = "n1deck"
path = "src/bin/n1deck.rs"

[[bin]]
name = "n1deck-config"
path = "src/bin/n1deck-config.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd", "dep:ureq", "dep:resvg"]

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
mirajazz = "0.13"
futures-lite = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
open = "5"
dirs = "5"
ab_glyph = "0.2"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
sha2 = "0.10"
base64 = "0.22"
eframe = { version = "0.31", optional = true, default-features = false, features = ["glow", "default_fonts", "x11"] }
rfd = { version = "0.15", optional = true }
ureq = { version = "2", optional = true }
resvg = { version = "0.45", optional = true, default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_System_Console", "Win32_Foundation", "Win32_System_Diagnostics_ToolHelp"] }
tray-icon = { version = "0.19", default-features = false }
tao = "0.30"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
