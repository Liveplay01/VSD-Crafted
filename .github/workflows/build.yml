name: build-windows
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --lib
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: n1deck-windows
          path: |
            target/release/n1deck.exe
            target/release/n1deck-config.exe
